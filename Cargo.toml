# tambanokano — a rewriting-logic and membership-equational-logic runtime.
# Engine code is MIT (./LICENSE). Stock Maude companion libs in share/maude-gpl/ remain GPLv2+.
# See ./NOTICE for the multi-license aggregate layout.
[workspace]
resolver = "3"
members = [
    "crates/tnk-core",
    "crates/tnk-frontend",
    "crates/tnk-modules",
    "crates/tnk-session",
    "crates/tnk-repl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"        # Arena handles keep unsafe code rare and explicit.

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
