# tambanokano — a Rust rewrite of Maude (rewriting logic + membership equational logic).
# Engine code is MIT (./LICENSE). Stock Maude companion libs in share/maude-gpl/ remain GPLv2+.
# See ./NOTICE for the multi-license aggregate layout.
[workspace]
resolver = "3"
members = [
    "crates/tnk-core",
    "crates/tnk-frontend",
    "crates/tnk-modules",
    "crates/tnk-session",
    "crates/tnk-repl",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"        # D1/D2: arena+handles should keep `unsafe` rare and deliberate.

[workspace.lints.clippy]
# shared lints can be tightened as the codebase grows
