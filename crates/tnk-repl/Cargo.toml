[package]
name = "tnk-repl"
description = "tambanokano REPL: an interactive shell over the module system — enter modules, reduce/match, show/select"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true
[features]
default = []
smt-z3 = ["tnk-session/smt-z3"]

[dependencies]
tnk-session = { path = "../tnk-session" }
rustyline = "14"               # interactive line editing + history (binary only)
