[package]
name = "tnk-core"
description = "tambanokano kernel: terms, GC'd DAG arena, order-sorted types, theories, reduction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true
[features]
default = []
smt-z3 = ["dep:z3"]


[dependencies]
# Arbitrary-precision integers and rationals behind `crate::num`; malachite is LGPL-3.0-only.
malachite = "0.9"
# Heap-backed stack growth at the nested-condition seam: an unbounded rewrite condition remains
# interruptible and heap-growing instead of aborting on call-stack overflow.
stacker = "0.1"
# Order-sorted-unification sort computation (SortBdds + AllSat). The default build remains pure Rust
# and requires no native BDD library.
biodivine-lib-bdd = "0.5.27"
# Optional native SMT backend; default builds remain pure Rust.
z3 = { version = "0.20.2", optional = true, default-features = false }

[dev-dependencies]
# Only for a SortBdds test cross-check: biodivine's `Bdd::exact_cardinality` returns a
# `num_bigint::BigInt`; the test compares the AllSat enumeration count against it.
num-bigint = "0.4.6"
